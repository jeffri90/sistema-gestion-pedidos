spring.application.name=sistema-gestion-pedidos
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/pedidos;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
spring.messages.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
joinfaces.faces-servlet.url-mappings=*.xhtml
joinfaces.faces.project-stage=production
app.jwt.secret=${JWT_SECRET:demo-local-apf2-cambiar-esta-clave-de-32-bytes-minimo}
app.jwt.minutes=30
app.users.admin-password=${ADMIN_PASSWORD:Admin123!}
app.users.ventas-password=${VENTAS_PASSWORD:Ventas123!}
app.users.consulta-password=${CONSULTA_PASSWORD:Consulta123!}
app.demo-data=true
