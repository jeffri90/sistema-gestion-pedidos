services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: pedidos
      POSTGRES_USER: pedidos
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pedidos_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pedidos_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedidos -d pedidos"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pedidos_data:
